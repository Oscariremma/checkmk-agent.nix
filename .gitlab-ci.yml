stages:
  - lint
  - check

lint:nixfmt:
  image: nixpkgs/nix-flakes:latest
  stage: lint
  script:
    - nix develop -c nixfmt -c *.nix

lint:deadnix:
  image: nixpkgs/nix-flakes:latest
  stage: lint
  script:
    - nix develop -c deadnix -f .

check:nix:
  image: nixpkgs/nix-flakes:latest
  stage: check
  script:
    - nix build .#checkmk-agent
    - nix flake check -L
    - nix log .#checkmk-agent &> build-log.txt
  artifacts:
    paths:
      - build-log.txt
