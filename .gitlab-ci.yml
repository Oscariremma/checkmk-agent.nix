default:
  image: nixpkgs/nix-flakes:latest
  tags:
    - nixos

stages:
  - lint
  - check

lint:nixfmt:
  stage: lint
  script:
    - nix develop -c nixfmt -c *.nix

lint:deadnix:
  stage: lint
  script:
    - nix develop -c deadnix -f .

check:nix:
  stage: check
  script:
    - nix build .#checkmk-agent
    - nix flake check -L
