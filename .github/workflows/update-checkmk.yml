# Set UPDATE_PR_TOKEN to a fine-grained PAT scoped to this repository with
# Contents and Pull requests read/write permissions; renew it before expiry.
# Enable squash auto-merge and require Lint and Build and test on the default branch.
name: Update Checkmk

on:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-checkmk
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Check update token
        env:
          UPDATE_PR_TOKEN: ${{ secrets.UPDATE_PR_TOKEN }}
        run: |
          if [ -z "$UPDATE_PR_TOKEN" ]; then
            echo '::error::Set the UPDATE_PR_TOKEN repository secret. See setup comments in update-checkmk.yml.'
            exit 1
          fi
      - uses: cachix/install-nix-action@v31.11.3
        with:
          enable_kvm: false
          extra_nix_config: |
            max-jobs = 2
            cores = 2
      - name: Update version and hashes
        run: nix develop -c ./scripts/update-checkmk
      - name: Read updated version
        id: version
        run: echo "version=$(nix eval --raw .#checkmk-agent.version)" >> "$GITHUB_OUTPUT"
      - name: Create or update pull request
        id: pr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.UPDATE_PR_TOKEN }}
          branch: automation/update-checkmk
          delete-branch: true
          add-paths: |
            package.nix
            README.md
          commit-message: 'chore: update Checkmk to ${{ steps.version.outputs.version }}'
          title: 'chore: update Checkmk to ${{ steps.version.outputs.version }}'
          body: |
            Updates Checkmk, its source and Cargo dependency hashes, and the README badge.
            The SMART and Docker plugins follow the agent version.
      - name: Enable auto-merge
        if: steps.pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.pull-request-number }}
          PR_HEAD: ${{ steps.pr.outputs.pull-request-head-sha }}
        run: gh pr merge "$PR_NUMBER" --auto --squash --match-head-commit "$PR_HEAD"
